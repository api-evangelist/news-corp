description: >-
  News Corp (Nasdaq: NWS, NWSA) is a global, diversified media and information services
  company focused on creating and distributing authoritative and engaging content across
  publishing, news media, digital real estate services, and book publishing. Its businesses
  and brands include Dow Jones (The Wall Street Journal, Barron's, MarketWatch, Investor's
  Business Daily), the New York Post, News UK (The Times, The Sun), News Corp Australia,
  HarperCollins, Storyful, REA Group and Realtor.com. No public developer program or API
  documentation is published on newscorp.com.

